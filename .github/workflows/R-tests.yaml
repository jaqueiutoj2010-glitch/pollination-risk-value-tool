# Testes automáticos da versão R/Shiny V2.41 (pasta shiny-app/).
# Automated tests for the R/Shiny V2.41 release (shiny-app/ folder).
name: R tests

on:
  push:
    paths: ["shiny-app/**", "site/assets/app.js", "site/data/article_4M.csv", "tools/calc_js_cli.mjs", ".github/workflows/R-tests.yaml"]
  pull_request:
    paths: ["shiny-app/**", "site/assets/app.js", "site/data/article_4M.csv", "tools/calc_js_cli.mjs", ".github/workflows/R-tests.yaml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Os testes usam caminhos relativos (app.R, data/, tests/).
        # The tests use relative paths (app.R, data/, tests/).
        working-directory: shiny-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript run_tests.R
