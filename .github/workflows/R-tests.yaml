# Testes automáticos da versão R/Shiny V2.41 (pasta shiny-app/).
# Automated tests for the R/Shiny V2.41 release (shiny-app/ folder).
name: R tests

on:
  push:
    paths: ["shiny-app/**", "site/assets/app.js", "site/data/article_4M.csv", "tools/calc_js_cli.mjs", ".github/workflows/R-tests.yaml"]
  pull_request:
    paths: ["shiny-app/**", "site/assets/app.js", "site/data/article_4M.csv", "tools/calc_js_cli.mjs", ".github/workflows/R-tests.yaml"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Os testes usam caminhos relativos (app.R, data/, tests/).
        # The tests use relative paths (app.R, data/, tests/).
        working-directory: shiny-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript run_tests.R
      - name: Record code and input SHA-256 hashes
        if: always()
        working-directory: .
        shell: bash
        run: |
          mkdir -p validation-output
          sha256sum shiny-app/app.R site/assets/app.js shiny-app/data/article_4M.csv site/data/article_4M.csv tools/calc_js_cli.mjs shiny-app/tests/test_cross_implementation.R > validation-output/sha256_manifest.txt
          printf 'commit=%s\nbranch=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > validation-output/ci_metadata.txt
      - name: Archive reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-evidence-${{ github.run_id }}
          path: |
            validation-output/
          if-no-files-found: warn
          retention-days: 90
